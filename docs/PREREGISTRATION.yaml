  amendments:
    - version: v5
      date: 2026-08-07
      locked_at: 2026-08-07T12:20:38+08:00
      title: 转录组全量扫描层（transcriptome-wide cis-MR scan）
  research_question: >-
    全血细胞转录本(cis-eQTL)与循环蛋白(cis-pQTL)两个介质层，哪个更能作为
    代谢疾病(T2D/CAD)的干预介质层？回答的是因果介质物种而非药物模态。
  exposure_channels:
    channel_A_transcript:
      source: eQTLGen 全血 cis-eQTL
      n: 31684
    channel_B_protein:
      source: deCODE 血浆 cis-pQTL
      n: 35559
    backup_protein:
      source: INTERVAL SomaScan pQTL via OpenGWAS prot-a-*
      condition: 若 deCODE 不可得
  outcomes:
    - id: ieu-b-38
      trait: T2D
    - id: ieu-a-7
      trait: CAD
    - id: finn-b-E4_DM2
      trait: T2D_FINNGEN
  instrument_criteria:
    cis_window_kb: 1000
    p_threshold: 5e-06
    ld_clumping: {r2: 0.01, window_kb: 1000, ref: "EUR (1000G Phase 3)"}
    palindromic_action: 2
  mr_methods:
    primary: mr_ivw_mre
    sensitivity: [mr_ivw_fe, mr_weighted_median, mr_egger_regression]
    multiple_testing: BH-FDR q<0.05
  four_state_classification:
    states: [concordant, protein_only, transcript_only, both_null]
    criterion: "CI 是否跨 0 与 p 值双重判定，CI/PP 为基础，不做 |Δ| 跨基因排序"
  controls:
    positive_calibration: [PCSK9, CETP]
    negative_controls: [HMGCR, NPC1L1, ANGPTL3, APOC3]
    negative_control_analysis: "留一法 LOOCV AUR；AUR≤0.5 仅做描述性报告（预注册约定）"
  hypotheses:
    H1:
      text: 分泌型蛋白 vs 细胞内蛋白在 pQTL-MR 显著性率与方向一致性上存在差异
      test: "Fisher/χ² on 2×2 (secreted vs intracellular × significant-yes/no), α=0.05 two-sided"
    H2:
      text: 负对照蛋白 LOOCV 分类器 AUR > 0.5
      test: "leave-one-out AUC on 4 negative-control proteins, α=0.05 one-sided"
  seed:
    master: 20260805
    note: 全部下游随机从 master 确定性派生
  reporting_discipline:
    - 全网格结果全部落盘报告，无论是否显著，含空结果与失败记录
    - 禁止事后调整阈值/方法以追求显著
    - 阴性结果如实报告
    - 每个数据源记录 ID/URL/日期，全部可追溯
    - 复现: UKB-PPP pQTL (Sun 2023) / INTERVAL independent split
  v5_scan_layer_amendment:
    scope: eQTLGen 全部有显著 cis-eQTL 的基因对 T2D/CAD/FBG 的系统扫描（假设生成层）
    instrument: "每基因最强 cis-eQTL（lead variant：该基因 cis±1Mb、P<5e-6 内 P 最小的单变异）"
    method: "单工具 Wald ratio (nsnp=1)"
    clumping: "不逐基因 LD clump；命中基因（FDR q<0.05）第二阶段本地 plink(1000G EUR, 1kg.v3) clump r²<0.01@1000kb + IVW-MRE 复核"
    outcome_extraction_proxies: false
    multiple_testing: 按结局 BH-FDR q<0.05
    strictness: "扫描层 hypothesis-generating；结论级证据以深度层为准（不移动门柱）"
  journal_plan_original:
    note: "原 v0.1.0 记载（审稿人核定，2026-08-06）；README 已按作者决定移除期刊目标段落，此处仅忠实存档"
    targets: ["eBioMedicine (IF≈9)", "Human Genetics (IF≈3.9)", "J Lipid Res (IF≈3.6)"]
